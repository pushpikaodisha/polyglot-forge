<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" width="100%" height="480">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12051D"/>
      <stop offset="100%" stop-color="#220B38"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="480" rx="16" fill="url(#bg)"/>
  
  <text x="550" y="38" fill="#F72585" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle">POLYGLOTFORGE API SIMULATION &amp; CHAOS INJECTION PIPELINE</text>
  <text x="550" y="60" fill="#64748B" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Incoming HTTP → Route Matcher → Chaos Injector (Jitter / 5xx Spikes) → Template Compiler → Traffic Buffer</text>

  <!-- Step 1: Client Request -->
  <g transform="translate(50, 100)">
    <rect width="200" height="240" rx="10" fill="#250B3D" stroke="#F72585" stroke-width="1.5"/>
    <text x="100" y="30" fill="#F72585" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">1. CLIENT REQUEST</text>
    
    <rect x="15" y="55" width="170" height="35" rx="6" fill="#3B1260"/>
    <text x="100" y="77" fill="#E2E8F0" font-family="monospace" font-size="11" text-anchor="middle">GET /mock/v1/users</text>

    <rect x="15" y="100" width="170" height="35" rx="6" fill="#3B1260"/>
    <text x="100" y="122" fill="#E2E8F0" font-family="monospace" font-size="11" text-anchor="middle">POST /mock/v1/orders</text>

    <text x="100" y="170" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Frontend / Mobile Apps</text>
    <text x="100" y="190" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Stress-Testing Backend</text>
  </g>

  <path d="M 260 220 L 305 220" stroke="#F72585" stroke-width="2.5"/>
  <polygon points="310,220 300,215 300,225" fill="#F72585"/>

  <!-- Step 2: Route Matcher -->
  <g transform="translate(315, 100)">
    <rect width="210" height="240" rx="10" fill="#250B3D" stroke="#7209B7" stroke-width="1.5"/>
    <text x="105" y="30" fill="#7209B7" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2. ROUTE MATCHER</text>
    
    <rect x="15" y="55" width="180" height="40" rx="6" fill="#3B1260"/>
    <text x="95" y="80" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Method &amp; Path Regex</text>

    <rect x="15" y="105" width="180" height="40" rx="6" fill="#3B1260"/>
    <text x="95" y="130" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Path Parameters (:id)</text>

    <rect x="15" y="155" width="180" height="40" rx="6" fill="#3B1260"/>
    <text x="95" y="180" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Query &amp; Header Filter</text>
  </g>

  <path d="M 535 220 L 580 220" stroke="#EF4444" stroke-width="2.5"/>
  <polygon points="585,220 575,215 575,225" fill="#EF4444"/>

  <!-- Step 3: Chaos Injector -->
  <g transform="translate(590, 100)">
    <rect width="220" height="240" rx="10" fill="#250B3D" stroke="#EF4444" stroke-width="2"/>
    <text x="110" y="30" fill="#EF4444" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">3. CHAOS INJECTOR</text>
    
    <rect x="15" y="55" width="190" height="40" rx="6" fill="#4B0B20"/>
    <text x="105" y="80" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚡ Latency Jitter (50-5000ms)</text>

    <rect x="15" y="105" width="190" height="40" rx="6" fill="#4B0B20"/>
    <text x="105" y="130" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">💥 Error Spikes (500, 502, 504)</text>

    <rect x="15" y="155" width="190" height="40" rx="6" fill="#4B0B20"/>
    <text x="105" y="180" fill="#EF4444" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">🚫 Rate Limiter (429 Drops)</text>
  </g>

  <path d="M 820 220 L 865 220" stroke="#10B981" stroke-width="2.5"/>
  <polygon points="870,220 860,215 860,225" fill="#10B981"/>

  <!-- Step 4: Response & Traffic Buffer -->
  <g transform="translate(875, 100)">
    <rect width="180" height="240" rx="10" fill="#250B3D" stroke="#10B981" stroke-width="1.5"/>
    <text x="90" y="30" fill="#10B981" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">4. RESPONSE &amp; LOG</text>
    
    <rect x="15" y="55" width="150" height="45" rx="6" fill="#3B1260"/>
    <text x="90" y="82" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Dynamic JSON</text>

    <rect x="15" y="110" width="150" height="45" rx="6" fill="#3B1260"/>
    <text x="90" y="137" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Traffic Buffer</text>

    <rect x="15" y="165" width="150" height="45" rx="6" fill="#10B981" opacity="0.2"/>
    <text x="90" y="192" fill="#10B981" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Waterfall Inspector</text>
  </g>

  <g transform="translate(50, 365)">
    <rect width="1000" height="85" rx="8" fill="#180727" stroke="#3B1260"/>
    <text x="30" y="30" fill="#F72585" font-family="system-ui, sans-serif" font-size="13" font-weight="700">⚡ CHAOS ENGINEERING &amp; FAULT INJECTION ARCHITECTURE:</text>
    <text x="30" y="50" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Simulates unpredictable production network environments by introducing bounded latency jitter and artificial 5xx error spikes.</text>
    <text x="30" y="68" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="12">Dynamic template engine evaluates macros (UUID, timestamps, names) while a circular buffer captures live traffic for visual replay.</text>
  </g>
</svg>